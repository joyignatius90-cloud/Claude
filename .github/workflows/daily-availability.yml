name: Send daily availability on WhatsApp

on:
  schedule:
    # Times are in UTC. 03:00 UTC = 8:30 AM India, 3:00 AM London, 10:00 PM New York (previous day).
    # Change this to the time you want. GitHub can start scheduled runs a few minutes late.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for sending by hand

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python daily_availability.py --send
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          CLIENTS: ${{ secrets.CLIENTS }}
