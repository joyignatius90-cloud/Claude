name: Send daily availability on WhatsApp

on:
  schedule:
    # Runs every hour; the script only sends during the hour starting at
    # "send_time" in the "timezone" from availability.json (10:00 by default).
    - cron: "0 * * * *"
  workflow_dispatch: {}   # "Run workflow" button: sends immediately

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Send
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python daily_availability.py --send
          else
            python daily_availability.py --send-if-due
          fi
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          CLIENTS: ${{ secrets.CLIENTS }}
          GROUPS: ${{ secrets.GROUPS }}
